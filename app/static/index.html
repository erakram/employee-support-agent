  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385;
      --border: #e2e5eb; --accent: #2f6fed; --accent-text: #ffffff;
      --user-bg: #2f6fed; --bot-bg: #f0f2f6; --tool-bg: #eef4ff; --tool-text: #2a4f9e; --error: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --panel: #1a1e26; --text: #e6e9ef; --muted: #8d95a7;
        --border: #2a303c; --accent: #5b8cff; --user-bg: #3a63c8; --bot-bg: #232834;
        --tool-bg: #1f2a40; --tool-text: #9db8f5; --error: #ff7a6b;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
           background: var(--bg); color: var(--text); }
    .app { max-width: 760px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 16px; }
    header { padding: 4px 0 12px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    #log { flex: 1; overflow-y: auto; background: var(--panel); border: 1px solid var(--border);
           border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--user-bg); color: var(--accent-text); }
    .bot { align-self: flex-start; background: var(--bot-bg); }
    .error { align-self: flex-start; color: var(--error); font-size: 14px; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .tool { background: var(--tool-bg); color: var(--tool-text); font: 12px ui-monospace, monospace;
            padding: 2px 8px; border-radius: 6px; }
    .answer p { margin: 0 0 6px; }
    .answer ul { margin: 0 0 6px; padding-left: 20px; }
    .answer code { font: 13px ui-monospace, monospace; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }
    .suggestions button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
                          border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
    .suggestions button:hover { border-color: var(--accent); }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--panel); color: var(--text); font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button[type=submit] { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px;
                          padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .who { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .wave { display: inline-block; transform-origin: 70% 70%; animation: wave 2.4s ease-in-out infinite; }
    @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(16deg); } 20%, 40% { transform: rotate(-8deg); } }
    .status { display: flex; align-items: center; gap: 10px; }
    .status .emoji { font-size: 16px; }
    .status .text { animation: fade-in .35s ease; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .dots span { display: inline-block; width: 5px; height: 5px; margin-left: 3px; border-radius: 50%; background: var(--muted);
                 animation: blink 1.2s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .avatar { display: inline-block; width: var(--size, 28px); height: var(--size, 28px); border-radius: 50%;
              overflow: hidden; flex: none; vertical-align: middle; box-shadow: 0 0 0 2px var(--border); }
    .avatar svg { display: block; width: 100%; height: 100%; }
    header h1 { display: flex; align-items: center; gap: 10px; }
    .who { display: flex; align-items: center; gap: 6px; }
    .status .avatar { animation: think 1.6s ease-in-out infinite; }
    @keyframes think { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-3px) rotate(-6deg); }
                       75% { transform: translateY(-3px) rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) { .wave, .status .avatar, .status .text, .dots span { animation: none; } }
    footer { text-align: center; font-size: 13px; color: var(--muted); padding-top: 10px; }
    footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1><span data-avatar="40"></span> Akram · Employee Support Agent</h1>
      <p>Ask about colleagues, leave balances or HR policies at Northwind Labs (sample data).</p>
    </header>
    <div id="log">
      <div class="msg bot"><div class="who"><span data-avatar="22"></span> Akram</div>Hi, I'm Akram <span class="wave">👋</span> I can look up colleagues, check leave balances and explain HR policies. Try one of these:</div>
      <div class="suggestions">
        <button>Who is Priya Nair's manager?</button>
        <button>How many annual leave days does Daniel Reyes have left?</button>
        <button>What's the remote work policy?</button>
        <button>Who works in Sales?</button>
      </div>
    </div>
    <form id="form">
      <input id="input" placeholder="Ask a question…" autocomplete="off" maxlength="2000" required>
      <button type="submit">Send</button>
    </form>
    <footer>
      Built by <a href="https://www.linkedin.com/in/er-mohammad-akram/" target="_blank" rel="noopener">Mohammad Akram</a>
      · <a href="https://github.com/erakram/employee-support-agent" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>
  <template id="akram-avatar"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="120" height="120" fill="#f4efe4"/><g><path d="M14 124 Q16 96 60 94 Q104 96 106 124 Z" fill="#4f6e48"/><path d="M44 96 Q60 106 76 96 Q60 100 44 96 Z" fill="#3f5a3a"/><rect x="50" y="78" width="20" height="18" rx="6" fill="#e9b892"/><circle cx="32" cy="62" r="6.5" fill="#efbf9b"/><circle cx="88" cy="62" r="6.5" fill="#efbf9b"/><ellipse cx="60" cy="60" rx="27" ry="31" fill="#f6cfad"/><path d="M33 60 Q33 94 60 96 Q87 94 87 60 Q86 76 76 80 Q68 74 60 76 Q52 74 44 80 Q34 76 33 60 Z" fill="#7b4a2b"/><path d="M46 80 Q60 94 74 80 Q60 85 46 80 Z" fill="#ffffff" stroke="#5a3019" stroke-width="1.5" stroke-linejoin="round"/><path d="M57 63 Q60 71 63 63" fill="none" stroke="#d99b77" stroke-width="2" stroke-linecap="round"/><path d="M29 58 Q22 34 38 24 Q44 12 60 15 Q76 10 86 22 Q100 32 91 58 Q89 44 80 40 Q72 46 62 41 Q52 47 43 42 Q35 46 29 58 Z" fill="#8a5a2e"/><circle cx="36" cy="30" r="10" fill="#8a5a2e"/><circle cx="50" cy="19" r="11" fill="#8a5a2e"/><circle cx="66" cy="16" r="11" fill="#8a5a2e"/><circle cx="81" cy="24" r="10" fill="#8a5a2e"/><circle cx="89" cy="38" r="7" fill="#8a5a2e"/><circle cx="30" cy="42" r="7" fill="#8a5a2e"/><path d="M38 28 Q44 21 52 24 M56 16 Q64 11 72 16 M74 24 Q82 22 86 30 M46 35 Q55 29 64 34" fill="none" stroke="#a8743f" stroke-width="2.5" stroke-linecap="round"/><path d="M39 47 Q46 43 53 46 M67 46 Q74 43 81 47" fill="none" stroke="#6b3f22" stroke-width="3" stroke-linecap="round"/><circle cx="47" cy="57" r="5.5" fill="#ffffff"/><circle cx="73" cy="57" r="5.5" fill="#ffffff"/><circle cx="47.5" cy="57.5" r="3" fill="#3a2516"/><circle cx="72.5" cy="57.5" r="3" fill="#3a2516"/><circle cx="48.5" cy="56.3" r="1" fill="#ffffff"/><circle cx="73.5" cy="56.3" r="1" fill="#ffffff"/><rect x="36" y="48" width="22" height="18" rx="9" fill="none" stroke="#4a2e1c" stroke-width="3"/><rect x="62" y="48" width="22" height="18" rx="9" fill="none" stroke="#4a2e1c" stroke-width="3"/><path d="M58 55 Q60 53 62 55 M36 54 L31 52 M84 54 L89 52" fill="none" stroke="#4a2e1c" stroke-width="3" stroke-linecap="round"/></g></svg></template>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = form.querySelector("button");
    const history = [];

    function add(cls, text) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    // Minimal, safe Markdown: escape all HTML first, then add bold, inline code and bullet lists.
    function renderMarkdown(text) {
      const escaped = text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
      let html = "", inList = false;
      for (const line of escaped.split("\n")) {
        const item = line.match(/^\s*[-*•]\s+(.*)/);
        if (item) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${inline(item[1])}</li>`;
          continue;
        }
        if (inList) { html += "</ul>"; inList = false; }
        if (line.trim()) html += `<p>${inline(line)}</p>`;
      }
      return html + (inList ? "</ul>" : "");
    }

    // While waiting for the answer, show what Akram is working on. The steps advance on a timer
    // (the API returns one response at the end) and stop at the last one.
    function showStatus(steps) {
      const bubble = add("bot", "");
      bubble.innerHTML = '<div class="status"><span data-avatar="30"></span><span class="emoji"></span><span class="text"></span><span class="dots"><span></span><span></span><span></span></span></div>';
      let i = 0;
      const show = () => {
        const [emoji, text] = steps[i];
        bubble.querySelector(".emoji").textContent = emoji;
        const label = bubble.querySelector(".text");
        label.textContent = text;
        label.style.animation = "none"; label.offsetWidth; label.style.animation = "";  // replay fade-in
      };
      fillAvatars(bubble);
      show();
      const timer = setInterval(() => { if (i < steps.length - 1) { i++; show(); } }, 1800);
      return { remove() { clearInterval(timer); bubble.remove(); } };
    }

    function whoLabel(bubble) {
      const who = document.createElement("div");
      who.className = "who";
      who.innerHTML = '<span data-avatar="22"></span> Akram';
      fillAvatars(who);
      bubble.prepend(who);
    }

    // Replace each <span data-avatar="size"> with Akram's avatar at that size.
    function fillAvatars(root = document) {
      root.querySelectorAll("[data-avatar]").forEach((el) => {
        const span = document.createElement("span");
        span.className = "avatar";
        span.style.setProperty("--size", el.dataset.avatar + "px");
        span.innerHTML = document.getElementById("akram-avatar").innerHTML;
        el.replaceWith(span);
      });
    }
    fillAvatars();

    function describe(call) {
      const args = Object.entries(call.arguments).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
      return `${call.name}(${args})`;
    }

    async function send(text) {
      add("user", text);
      input.value = "";
      sendBtn.disabled = true;
      const thinking = showStatus([
        ["🤔", "Akram is reading your question"],
        ["🔍", "Akram is searching the employee directory"],
        ["📋", "Akram is checking HR records"],
        ["✍️", "Akram is writing the answer"],
      ]);
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: history.slice(-20) }),
        });
        const data = await res.json();
        thinking.remove();
        if (!res.ok) {
          add("error", typeof data.detail === "string" ? data.detail : "Something went wrong.");
          return;
        }
        const bubble = add("bot", "");
        whoLabel(bubble);
        if (data.tool_calls.length) {
          const tools = document.createElement("div");
          tools.className = "tools";
          for (const call of data.tool_calls) {
            const chip = document.createElement("span");
            chip.className = "tool";
            chip.textContent = "🔧 " + describe(call);
            tools.appendChild(chip);
          }
          bubble.appendChild(tools);
        }
        const answer = document.createElement("div");
        answer.className = "answer";
        answer.innerHTML = renderMarkdown(data.answer);
        bubble.appendChild(answer);
        bubble.style.whiteSpace = "normal";
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${data.latency_ms} ms`;
        bubble.appendChild(meta);
        history.push({ role: "user", content: text }, { role: "assistant", content: data.answer });
      } catch {
        thinking.remove();
        add("error", "Could not reach the server.");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); if (input.value.trim()) send(input.value.trim()); });
    document.querySelectorAll(".suggestions button").forEach((b) => b.addEventListener("click", () => send(b.textContent)));
  </script>
</body>
</html>
